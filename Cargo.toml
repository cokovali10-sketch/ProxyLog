[package]
name = "proxylog"
version = "0.1.0"
edition = "2021"
description = "Mini HTTP proxy for intercepting and logging requests"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
bytes = "1"
chrono = "0.4"
